<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=750, initial-scale=1">
  <title>穷人的紧急出口</title>
  <style>
    *{margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,PingFang SC,Hiragino Sans GB,sans-serif;background:#fff;color:#333;min-height:100vh;padding:24px 0}
    .wrap{max-width:680px;margin:0 auto;padding:32px 28px}
    h1{font-size:22px;font-weight:700;color:#E85A24;margin-bottom:8px;line-height:1.35}
    .sub{font-size:13px;color:#888;margin-bottom:28px}
    .row{border-left:4px solid #E85A24;background:#FFF8F5;padding:16px 20px;margin-bottom:14px;border-radius:0 8px 8px 0}
    .row-before{font-size:12px;color:#999;margin-bottom:4px}
    .row-after{font-size:15px;font-weight:600;color:#333;line-height:1.45}
    .row-after em{color:#E85A24;font-style:normal}
    .foot{font-size:11px;color:#aaa;text-align:center;margin-top:24px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>「穷人的紧急出口」</h1>
    <p class="sub">—— 我们是这样翻译「钱紧」的</p>

    <div class="row">
      <div class="row-before">改前：生存天数：5天 · 危险等级：红色</div>
      <div class="row-after">改后：<em>这5天怎么过？</em> → 今日可执行清单已生成</div>
    </div>
    <div class="row">
      <div class="row-before">改前：机会雷达 · 兼职 · 零工 · 变现</div>
      <div class="row-after">改后：<em>今天能赚到的钱</em> · 「你适合的」为你筛选</div>
    </div>
    <div class="row">
      <div class="row-before">改前：债务谈判官 · 生成协商话术</div>
      <div class="row-after">改后：<em>打这个电话之前，先让我教你两句。</em></div>
    </div>

    <p class="foot">精打细算 Pro · 钱紧不慌</p>
  </div>
</body>
</html>
