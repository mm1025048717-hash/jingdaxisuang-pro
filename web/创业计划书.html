<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创业计划书 - 精打细算 Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --orange: #E85A24; --orange-l: #FFF3EB; --t1: #1a1a1a; --t2: #525252; --t3: #737373; --border: #e5e5e5; }
    html { scroll-behavior: smooth; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', -apple-system, sans-serif; background: #f8f8f8; color: var(--t1); line-height: 1.7; }
    .bp-header { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .bp-back { background: var(--orange-l); color: var(--orange); padding: 8px 16px; border-radius: 20px; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; transition: .2s; }
    .bp-back:hover { background: #FFE8D6; }
    .bp-title { font-size: 18px; font-weight: 700; }
    .bp-nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .bp-nav a { color: var(--t2); font-size: 13px; text-decoration: none; padding: 4px 10px; border-radius: 6px; }
    .bp-nav a:hover { color: var(--orange); background: var(--orange-l); }

    /* 产品原型（来自 md 内嵌） */
    .bp-prototype { background: linear-gradient(180deg, #fff 0%, #fafafa 100%); padding: 40px 20px 50px; text-align: center; }
    .bp-phone-frame { display: inline-block; background: #1a1a1a; border-radius: 32px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25), 0 0 0 3px #333; }
    .bp-phone-inner { width: 320px; height: 580px; border-radius: 24px; overflow: hidden; background: #fff; }
    .bp-phone-inner iframe { width: 100%; height: 100%; border: none; display: block; }

    /* 计划书正文 */
    .bp-wrap { max-width: 780px; margin: 0 auto; padding: 40px 24px 80px; }
    .bp-body { font-size: 15px; color: #333; }
    .bp-body h1 { font-size: 26px; margin: 48px 0 20px; color: var(--t1); padding-bottom: 8px; border-bottom: 2px solid var(--orange); }
    .bp-body h2 { font-size: 20px; margin: 36px 0 14px; color: var(--t1); }
    .bp-body h3 { font-size: 17px; margin: 24px 0 10px; color: #444; }
    .bp-body p { margin: 0 0 14px; }
    .bp-body ul, .bp-body ol { margin: 0 0 14px; padding-left: 26px; }
    .bp-body li { margin-bottom: 8px; }
    .bp-body table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14px; overflow-x: auto; display: block; }
    .bp-body table th, .bp-body table td { border: 1px solid #e0e0e0; padding: 12px 14px; text-align: left; }
    .bp-body table th { background: var(--orange-l); color: var(--orange); font-weight: 600; }
    .bp-body blockquote { margin: 20px 0; padding: 16px 20px; background: #f9f9f9; border-left: 4px solid var(--orange); color: #555; }
    .bp-body hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    .bp-body strong { font-weight: 600; }
    .bp-body em { color: var(--orange); font-style: normal; font-weight: 500; }
    .bp-toc { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 32px; border: 1px solid var(--border); }
    .bp-toc h3 { font-size: 15px; margin: 0 0 12px; color: var(--t2); }
    .bp-toc a { display: block; padding: 6px 0; font-size: 14px; color: var(--t1); text-decoration: none; }
    .bp-toc a:hover { color: var(--orange); }
    .bp-toc a:first-of-type { margin-top: 4px; }
    .bp-goprototype { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 8px 14px; background: var(--orange-l); color: var(--orange); border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; }
    .bp-goprototype:hover { background: #FFE8D6; }
    .bp-loading { text-align: center; padding: 60px 20px; color: var(--t3); }
    @media (max-width: 480px) {
      .bp-phone-inner { width: 280px; height: 508px; }
    }
  </style>
</head>
<body>
  <header class="bp-header">
    <a href="index.html" class="bp-back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>返回 App
    </a>
    <span class="bp-title">精打细算 Pro 创业计划书</span>
    <nav class="bp-nav">
      <a href="#prototype">产品原型</a>
      <a href="#policy">计划书正文</a>
    </nav>
  </header>

  <main class="bp-wrap">
    <div class="bp-toc">
      <h3>📋 目录</h3>
      <a href="#prototype">产品原型（可交互体验）</a>
      <a href="#policy">政策与行业背景</a>
      <a href="#tech">一、技术可行性分析</a>
      <a href="#market">二、市场可行性分析</a>
      <a href="#plan">三、实施方案和发展规划</a>
      <a href="#invest">四、投资估算与资金筹措</a>
      <a href="#economy">五、经济、社会效益分析</a>
      <a href="#team">六、创业团队介绍</a>
      <a href="#mindset">七、产品心智与关键文案</a>
      <a href="#prototype" class="bp-goprototype">↑ 返回顶部体验产品</a>
    </div>
    <div class="bp-body" id="content">
      <div class="bp-loading">加载中…</div>
    </div>
  </main>

  <script>
    const TOC_IDS = { '政策与行业背景':'policy', '一、技术可行性分析':'tech', '二、市场可行性分析':'market', '三、实施方案和发展规划':'plan', '四、投资估算与资金筹措':'invest', '五、经济、社会效益分析':'economy', '六、创业团队介绍':'team', '七、产品心智与关键文案':'mindset' };
    (async function() {
      const el = document.getElementById('content');
      try {
        const r = await fetch('创业计划书-穷人军师.md');
        const md = await r.text();
        el.innerHTML = marked.parse(md);
        el.querySelectorAll('h1, h2').forEach((h) => {
          const txt = h.textContent.trim();
          for (const [k, id] of Object.entries(TOC_IDS)) { if (txt.includes(k)) { h.id = id; break; } }
          if (!h.id) h.id = 'h' + Math.random().toString(36).slice(2, 8);
        });
      } catch (e) {
        el.innerHTML = '<p style="color:#999;text-align:center;padding:40px">无法加载创业计划书，请检查网络或刷新重试。</p>';
      }
    })();
  </script>
</body>
</html>
