<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创业计划书 - 精打细算 Pro</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .bp-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }
    .bp-hd { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .bp-back { background: #FFF3EB; color: #FF6B35; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .bp-back:hover { background: #FFE8D6; }
    .bp-title { font-size: 20px; font-weight: 700; color: #1a1a1a; }
    .bp-body { font-size: 15px; line-height: 1.7; color: #333; }
    .bp-body h1 { font-size: 22px; margin: 32px 0 16px; color: #1a1a1a; }
    .bp-body h2 { font-size: 18px; margin: 24px 0 12px; color: #333; }
    .bp-body h3 { font-size: 16px; margin: 20px 0 10px; color: #444; }
    .bp-body p { margin: 0 0 12px; }
    .bp-body ul, .bp-body ol { margin: 0 0 12px; padding-left: 24px; }
    .bp-body li { margin-bottom: 6px; }
    .bp-body table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
    .bp-body th, .bp-body td { border: 1px solid #e0e0e0; padding: 10px 12px; text-align: left; }
    .bp-body th { background: #FFF3EB; color: #FF6B35; font-weight: 600; }
    .bp-body blockquote { margin: 16px 0; padding: 12px 16px; background: #F9F9F9; border-left: 4px solid #FF6B35; color: #555; }
    .bp-body hr { border: none; border-top: 1px solid #e0e0e0; margin: 24px 0; }
    .bp-body em { color: #FF6B35; font-style: normal; font-weight: 500; }
  </style>
</head>
<body>
  <div class="bp-wrap">
    <div class="bp-hd">
      <a href="index.html" class="bp-back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>返回</a>
      <span class="bp-title">创业计划书</span>
    </div>
    <div class="bp-body" id="content">加载中…</div>
  </div>
  <script>
    (async function() {
      try {
        const r = await fetch('创业计划书-穷人军师.md');
        const md = await r.text();
        document.getElementById('content').innerHTML = marked.parse(md);
      } catch (e) {
        document.getElementById('content').innerHTML = '<p style="color:#999">无法加载创业计划书，请检查网络或刷新重试。</p>';
      }
    })();
  </script>
</body>
</html>
